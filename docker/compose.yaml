name: reverie-local

x-database-environment: &database-environment
  POSTGRES_DB: postgres
  POSTGRES_PASSWORD: reverie-local-postgres

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      <<: *database-environment
      JWT_SECRET: reverie-local-jwt-secret-change-before-sharing
      JWT_EXP: 764608000
    volumes:
      - reverie-db:/var/lib/postgresql/data
      - ./docker/postgres/00-local-roles.sql:/docker-entrypoint-initdb.d/init-scripts/00-local-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:reverie-local-postgres@db:5432/postgres?search_path=auth
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: http://localhost:4317
      GOTRUE_URI_ALLOW_LIST: http://localhost:4317/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: reverie-local-jwt-secret-change-before-sharing
      GOTRUE_JWT_ISSUER: http://localhost:54321/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:reverie-local-postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: reverie-local-jwt-secret-change-before-sharing
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: reverie-local-jwt-secret-change-before-sharing
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  realtime:
    container_name: realtime-dev.supabase-realtime
    image: supabase/realtime:v2.134.10
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: reverie-local-postgres
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: reverie-local-jwt-secret-change-before-sharing
      METRICS_JWT_SECRET: reverie-local-jwt-secret-change-before-sharing
      SECRET_KEY_BASE: reverie-local-realtime-secret-key-base-with-more-than-sixty-four-characters-0001
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H 'Authorization: Bearer ${LOCAL_ANON_KEY}' http://localhost:4000/api/tenants/realtime-dev/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    image: supabase/postgres:17.6.1.136
    depends_on:
      auth:
        condition: service_healthy
      realtime:
        condition: service_healthy
    environment:
      <<: *database-environment
      PGHOST: db
      PGUSER: postgres
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/postgres/apply-migrations.sh:/apply-migrations.sh:ro
    entrypoint: ["/bin/bash", "/apply-migrations.sh"]
    restart: "no"

  supabase:
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      realtime:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:54321:8000"
    volumes:
      - ./docker/nginx/supabase.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:8000/auth/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    env_file:
      - path: .env.local
        required: false
    build:
      context: .
      args:
        VITE_SUPABASE_URL: http://localhost:54321
        VITE_SUPABASE_ANON_KEY: ${LOCAL_ANON_KEY}
    restart: unless-stopped
    depends_on:
      supabase:
        condition: service_healthy
    environment:
      PORT: 4317
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4317:4317"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4317/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  reverie-db:
