map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8000;
  client_max_body_size 2m;

  # The hosted Supabase gateway adds these headers. Our lightweight local
  # gateway must do the same or browsers stop at the OPTIONS preflight.
  add_header Access-Control-Allow-Origin $http_origin always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  # Supabase JS adds PostgREST-specific headers such as Prefer and
  # Content-Profile. Echo the browser's requested header names so inserts and
  # RPC calls receive the same CORS treatment as reads and Auth.
  add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
  add_header Vary "Origin" always;

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Vary;

  if ($request_method = OPTIONS) {
    return 204;
  }

  location /auth/v1/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://auth:9999/;
  }

  location /rest/v1/ {
    proxy_set_header Host $host;
    proxy_pass http://rest:3000/;
  }

  location /realtime/v1/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host realtime-dev.supabase-realtime;
    proxy_pass http://realtime:4000/socket/;
  }
}
